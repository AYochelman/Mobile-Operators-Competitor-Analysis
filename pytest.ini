[pytest]
testpaths = tests
# Unit suite by default (~5s). Live carrier/provider tests are opt-in:
#   pytest -m integration -v          (needs internet + Playwright browsers)
#   pytest -m "" tests/                (everything)
addopts = -m "not integration"
markers =
    integration: live tests that hit real carrier sites / external network. Deselected by default (addopts); run with -m integration.
