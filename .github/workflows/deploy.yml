name: Deploy (Netlify)

# Deploying used to require ONE machine: the local Windows box is the only place
# with a logged-in Netlify CLI and a `.env.production`. A cloud/web session has
# neither, and its sandbox blocks api.netlify.com outright — so no agent or CI
# could ship, and every release waited on that laptop. This moves the deploy to
# a GitHub runner, which can reach both Netlify and api.mocaintel.com.
#
# ── SETUP: exactly ONE secret ────────────────────────────────────────────────
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  NETLIFY_AUTH_TOKEN
#     Value: Netlify → User settings → Applications → Personal access tokens → New
#
# Nothing else is needed. Every other build input is public and inlined below:
#   · VITE_API_URL / VITE_SUPABASE_URL  — public endpoints, already in CLAUDE.md
#   · VITE_SUPABASE_ANON_KEY            — a Supabase ANON key is public by design
#                                          and is ALREADY committed verbatim as the
#                                          fallback in src/lib/supabase.js, so
#                                          repeating it here exposes nothing new
#   · NETLIFY_SITE_ID                   — public (it is in the deploy-badge URL)
#   · VITE_DEV_AUTH=false               — must never be true in a production build
# Each may still be overridden by a repo secret of the same name if you would
# rather keep them out of this file.
#
# NB: VITE_API_KEY is set in the Netlify dashboard but is read by NOTHING — the
# code renamed it to VITE_DEV_API_KEY (a dev-only X-API-Key header). Production
# auth is the Supabase JWT, so no API key belongs in a production bundle.
#
# Until the token exists the job SKIPS and stays GREEN, with an instruction in
# the run summary. It never fails a merge and never ships a half-configured build.

on:
  push:
    branches: [main]
    paths:
      - 'mass-market-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never abort a half-finished deploy

env:
  # Public defaults; a repo secret of the same name wins if you set one.
  VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.mocaintel.com' }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gmfefvjdmgzluwffzrzj.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtZmVmdmpkbWd6bHV3ZmZ6cnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MTcwNzIsImV4cCI6MjA5MTA5MzA3Mn0.8RAX8o8yPHXSTYk_Fc3bmlk5fz4X5sl53k0SWNbHlvM' }}
  VITE_TIKTOK_PIXEL_ID: ${{ secrets.VITE_TIKTOK_PIXEL_ID }}
  VITE_DEV_AUTH: 'false'
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || '39164e5d-2df9-4254-82e1-a1e9d825a240' }}

jobs:
  deploy:
    name: Build + deploy to mocaintel.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mass-market-app
    steps:
      - uses: actions/checkout@v4

      - name: Is the deploy token configured?
        id: pre
        # The `secrets` context is not usable in a job-level `if`, so gate on a
        # step output instead. Missing token => skip, green, with instructions.
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — one secret missing"
              echo ""
              echo "Add **NETLIFY_AUTH_TOKEN** under *Settings → Secrets and variables → Actions*,"
              echo "then re-run this workflow (or merge anything into \`main\`) and it will deploy."
              echo ""
              echo "Get the value at: Netlify → User settings → Applications → Personal access tokens."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::NETLIFY_AUTH_TOKEN not set — deploy skipped (this is not a failure)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.pre.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mass-market-app/package-lock.json

      - name: Install
        if: steps.pre.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.pre.outputs.ready == 'true'
        # prerender-esim-dests.mjs fetches VITE_API_URL live. A GitHub runner can
        # reach api.mocaintel.com, so the ~160 destination pages are included
        # whenever the Cloudflare tunnel is up; if it is down the script warns and
        # exits 0, and the guard below still holds the rest of the build to spec.
        run: npm run build

      - name: Guard the artifact
        if: steps.pre.outputs.ready == 'true'
        # Match ngrok DOMAINS only: every bundle legitimately contains the string
        # "ngrok-skip-browser-warning" (a legacy request header kept after the
        # ngrok→Cloudflare move). Verified against a real dist — 7 hits, all the
        # header — so a bare `grep ngrok` would block every deploy.
        run: |
          for f in index.html landing.html hotels.html esim.html _redirects; do
            test -f "dist/$f" || { echo "::error::dist/$f missing"; exit 1; }
          done
          if grep -rqiE 'ngrok\.(io|app)|ngrok-free' dist/assets/*.js; then
            echo "::error::bundle points at an ngrok host — check VITE_API_URL"; exit 1
          fi
          host="${VITE_API_URL%/}"
          grep -rqF "$host" dist/assets/*.js \
            || { echo "::error::bundle does not contain $host"; exit 1; }
          # dist/_redirects is the live router; /go/* carries affiliate attribution.
          grep -q '^/go/\*' dist/_redirects \
            || { echo "::error::/go/* missing from dist/_redirects — affiliate links would break"; exit 1; }
          fp=$(grep -o 'assets/main-[^"]*\.js' dist/index.html | head -1)
          [ -n "$fp" ] || { echo "::error::no entry bundle in dist/index.html"; exit 1; }
          echo "FINGERPRINT=$fp" >> "$GITHUB_ENV"
          echo "Artifact $fp · API $host" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        if: steps.pre.outputs.ready == 'true'
        # --no-build is mandatory: without it the CLI rebuilds from Netlify's
        # dashboard env vars instead of the artifact just verified above.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --no-build

      - name: Verify it is live
        if: steps.pre.outputs.ready == 'true'
        # Not done until the live entry bundle matches the build. Fetch an SPA
        # route: "/" serves static landing.html, which has no main bundle.
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -s https://mocaintel.com/home | grep -o 'assets/main-[^"]*\.js' | head -1 || true)
            if [ "$live" = "$FINGERPRINT" ]; then
              echo "Live matches build: $live" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "attempt $i — live=[$live] want=[$FINGERPRINT]; retrying in 10s"; sleep 10
          done
          echo "::error::live bundle never matched $FINGERPRINT — CDN lag, or the deploy did not land."
          exit 1

      - name: Backend reachability (informational)
        if: steps.pre.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.mocaintel.com/api/ping || echo 000)
          echo "api.mocaintel.com/api/ping → HTTP $code" >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || echo "::warning::Flask/tunnel not answering — the site loads but shows no data."
