# Security headers. Mirror of public/_headers (the live source on drag-deploy;
# THIS file only takes effect on a future CI/Git deploy). Keep the two in sync.
# See public/_headers for the CSP rationale.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.tiktok.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://terra-nonrestrained-overpiteously.ngrok-free.dev https://gmfefvjdmgzluwffzrzj.supabase.co wss://gmfefvjdmgzluwffzrzj.supabase.co https://analytics.tiktok.com https://open.er-api.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Destination background images — mirror of the /dest-bg/* rule in public/_headers.
[[headers]]
  for = "/dest-bg/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Long-lived caching - mirror of public/_headers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
