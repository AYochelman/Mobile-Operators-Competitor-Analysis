# NOTE: production is a manual drag-deploy of dist/, so THIS file is NOT the live
# router - dist/_redirects (built from public/_redirects) is. Keep the two in sync
# so a future CI/Git deploy (which DOES read netlify.toml) behaves identically.
# Specific prerendered pages must precede the /* SPA catch-all (first match wins).

# "/" serves the pure-static prerendered marketing page (dist/landing.html) so it
# paints instantly with no SPA boot.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# "/hotels" serves the prerendered + hydrated Guest Connect marketing page.
[[redirects]]
  from = "/hotels"
  to = "/hotels.html"
  status = 200
  force = true

# "/esim-deals" serves the eSIM SPA shell whose canonical self-references the apex
# page (index.html's head would canonicalise it to the site root and de-index it).
[[redirects]]
  from = "/esim-deals"
  to = "/esim.html"
  status = 200
  force = true

# Everything else falls through to the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. Mirror of public/_headers (the live source on drag-deploy;
# THIS file only takes effect on a future CI/Git deploy). Keep the two in sync.
# See public/_headers for the CSP rationale.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mocaintel.com https://gmfefvjdmgzluwffzrzj.supabase.co wss://gmfefvjdmgzluwffzrzj.supabase.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Destination background images — mirror of the /dest-bg/* rule in public/_headers.
[[headers]]
  for = "/dest-bg/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
