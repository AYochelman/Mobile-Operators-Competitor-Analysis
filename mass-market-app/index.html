    <!-- Self-hosted Assistant (same-origin). The Hebrew subset is preloaded so the
         font is ready before first paint. Previously Assistant loaded from Google Fonts
         with display=optional behind a deferred (media=print) link, so on a fresh load
         it often was NOT applied at paint and the page stayed on the system fallback for
         the whole session; on some devices the bold Hebrew headings fell back to a serif
         system font. Preload + display:swap (in fonts.css) makes Assistant load reliably. -->
    <link rel="preload" href="/fonts/assistant-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
